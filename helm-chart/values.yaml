name: weather
replicaCount: 1
labels:
  application: helloworld
  service: doodle-weather
  version: blue
  shard: blue
image:
  repository: ghcr.io/scrogatl/doodle-weather
  tag: main
  pullPolicy: Always
containerName: weather
env:
- name: SHARD
  value: blue
- name: PYTHONUNBUFFERED
  value: '1'
ports:
- containerPort: 5100
  name: application
  protocol: TCP
service:
  name: doodle-weather
  type: ClusterIP
  ports:
  - name: http
    appProtocol: http
    port: 5100
